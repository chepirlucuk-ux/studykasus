<!DOCTYPE html>
<html>
<head>
    <title>Screen</title>
    <script language="JavaScript" type="text/JavaScript">
        function dimensi() {
            var t, l;
            t = screen.height;
            l = screen.width;
            alert("Dimensi layar web browser (tinggi x lebar) = " + t + " x " + l);
        }
    </script>
</head>
<body>
    <input name="dimensi" type="button" value="Ukuran Screen" onClick="dimensi()">
</body>
</html>
